version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: pkg/db/queries
    gen:
      go:
        package: db
        out: pkg/db/generated
        sql_package: pgx/v5
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - column: lab_chat.draft
            go_type: encoding/json.RawMessage
          - column: lab_message.proposal
            go_type: encoding/json.RawMessage
          - column: inbox_item.question_set
            go_type: encoding/json.RawMessage
          - column: inbox_item.answers
            go_type: encoding/json.RawMessage
          - column: coresearch_cell.outputs
            go_type: encoding/json.RawMessage
          - column: coresearch_run.facts
            go_type: encoding/json.RawMessage
          - column: runtime.metrics
            go_type: encoding/json.RawMessage
          - column: card.grounding_criteria
            go_type: encoding/json.RawMessage
            go_struct_tag: json:"-"
          - column: card.start_date
            go_type:
              type: time.Time
              pointer: true
          - column: research.start_date
            go_type:
              type: time.Time
              pointer: true
          - column: research.due_date
            go_type:
              type: time.Time
              pointer: true
