# Production stack: Caddy (HTTPS, landing page at /, dashboard at /app/) in front of the server, with
# PostgreSQL and Redis on an internal network. Only Caddy publishes ports.
name: lykeion

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile
  args:
    PUBLIC_URL: https://${DOMAIN:?}

# Logs hold client IPs; keep them small and rotating.
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "3" }

services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: owner
      POSTGRES_PASSWORD: ${OWNER_DB_PASSWORD:?}
      POSTGRES_DB: lykeion
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: pg_isready -U owner -d lykeion
      interval: 5s
      retries: 10

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]
    healthcheck:
      test: redis-cli ping
      interval: 5s
      retries: 10

  migrate:
    logging: *logging
    build: { <<: *build, target: server }
    image: lykeion-server
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      MIGRATE_DATABASE_URL: postgres://owner:${OWNER_DB_PASSWORD}@postgres:5432/lykeion?sslmode=disable
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    command:
      - sh
      - -ec
      - |
        migrate
        printf "ALTER ROLE lykeion_app LOGIN PASSWORD '%s';" "$$APP_DB_PASSWORD" | psql -q -v ON_ERROR_STOP=1 "$$MIGRATE_DATABASE_URL"

  server:
    logging: *logging
    image: lykeion-server
    restart: unless-stopped
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    environment:
      LISTEN_ADDR: :8080
      PUBLIC_URL: https://${DOMAIN}
      TRUSTED_PROXIES: 172.30.0.0/24
      DATABASE_URL: postgres://lykeion_app:${APP_DB_PASSWORD}@postgres:5432/lykeion?sslmode=disable
      MIGRATE_DATABASE_URL: postgres://owner:${OWNER_DB_PASSWORD}@postgres:5432/lykeion?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE: local:/data/blobs
      JWT_SECRET: ${JWT_SECRET:?}
      LYK_SECRET_KEY: ${LYK_SECRET_KEY:?}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    volumes: [blobs:/data/blobs]
    healthcheck:
      test: wget -q --spider http://127.0.0.1:8080/readyz
      interval: 10s
      retries: 6

  # Run on a schedule, not kept up: docker compose --profile backup run --rm backup
  backup:
    logging: *logging
    build: { <<: *build, target: backup }
    image: lykeion-backup
    profiles: [backup]
    depends_on: { postgres: { condition: service_healthy } }
    environment:
      MIGRATE_DATABASE_URL: postgres://owner:${OWNER_DB_PASSWORD}@postgres:5432/lykeion?sslmode=disable
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      SMTP_ADDR: ${SMTP_ADDR:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
    volumes: [blobs:/data/blobs:ro]

  caddy:
    logging: *logging
    build: { <<: *build, target: web }
    image: lykeion-web
    restart: unless-stopped
    depends_on: [server]
    environment:
      DOMAIN: ${DOMAIN}
      ALIAS_DOMAINS: ${ALIAS_DOMAINS:?}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: [caddydata:/data, caddyconfig:/config]

networks:
  default:
    ipam:
      config: [{ subnet: 172.30.0.0/24 }]

volumes:
  pgdata:
  redisdata:
  blobs:
  caddydata:
  caddyconfig:
