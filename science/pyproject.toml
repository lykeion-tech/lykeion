[project]
name = "lykeion-science"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.1",
    "uvicorn==0.54.0",
]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.83.0",
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "pytest==9.1.1",
]
