name: Bug report
description: Something in Lykeion doesn't work as it should.
# Maintainers add `bug` after triage: Aristotle picks up `bug` issues, so a
# form must never apply it on the reporter's behalf.
labels: [triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Paste exact error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a study…
        2. Assign it to…
        3. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options:
        - Desktop app (macOS)
        - Desktop app (Linux)
        - Web dashboard
        - lyk CLI or daemon
        - Self-hosted server
        - Website or docs
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The desktop app shows it in its menu.
      placeholder: "0.1.4"
  - type: dropdown
    id: agent
    attributes:
      label: Agent CLI involved
      options:
        - None
        - Claude Code
        - Codex
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, keys and anything private before pasting.
