name: Feature request
description: Suggest something Lykeion should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Sketches and examples help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead now
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Studies and stages
        - Agents, Teams and Workflows
        - Aristotle
        - Autoresearch or Coresearch
        - Decisions
        - Sources and evidence
        - Machines, daemon or CLI
        - Desktop app
        - Website or docs
        - Other
